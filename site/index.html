<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Visa Assistant — শীঘ্রই আসছে</title>
<style>
  :root { --bg:#f7f8fa; --fg:#1d2433; --muted:#5b6475; --card:#fff; --line:#e3e6ec; --accent:#0f766e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1218; --fg:#e7eaf0; --muted:#9aa3b2; --card:#171b23; --line:#262c38; --accent:#2dd4bf; } }
  * { box-sizing:border-box }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
         background:var(--bg); color:var(--fg); font:16px/1.6 system-ui, "Noto Sans Bengali", sans-serif; }
  main { max-width:560px; width:100%; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:32px; }
  h1 { margin:0 0 8px; font-size:1.6rem }
  .tag { display:inline-block; font-size:.8rem; color:var(--accent); border:1px solid var(--accent); border-radius:99px; padding:2px 10px; margin-bottom:16px }
  p { color:var(--muted); margin:0 0 12px }
  small { display:block; margin-top:20px; color:var(--muted); font-size:.8rem; border-top:1px solid var(--line); padding-top:12px }
</style>
</head>
<body>
<main>
  <span class="tag">উন্নয়নাধীন</span>
  <h1>Visa Application Assistant</h1>
  <p>ভারতীয় ভিসা আবেদনকারীদের জন্য ডকুমেন্ট ব্যবস্থাপনা, তথ্য যাচাই ও আবেদন প্রস্তুতির সফটওয়্যার।</p>
  <p>শীঘ্রই চালু হবে।</p>
  <small>এটি IVAC বা কোনো সরকারি প্রতিষ্ঠানের অফিসিয়াল ওয়েবসাইট নয় এবং তাদের সঙ্গে যুক্ত নয়। Design &amp; development: Super Soft Ltd.</small>
</main>
</body>
</html>
