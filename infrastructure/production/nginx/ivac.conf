# Installed on the VPS at /home/ubuntu/docker/proxy/data/nginx/custom/sites/ivac.conf
# Certificate: host certbot (webroot /home/ubuntu/docker/proxy/acme), mounted at /etc/letsencrypt-host
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ivac.supersoftltd.com;

    ssl_certificate /etc/letsencrypt-host/live/ivac.supersoftltd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-host/live/ivac.supersoftltd.com/privkey.pem;
    include /etc/letsencrypt-host/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt-host/ssl-dhparams.pem;

    client_max_body_size 10M;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex" always;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $web http://ivac-web:80;

    location / {
        proxy_pass $web;
        include /data/nginx/custom/snippets/proxy.conf;
    }
}
