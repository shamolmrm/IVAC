# Production stack on the shared VPS. Compose project: ivac.
# Phase 0: static placeholder only. App services are added in Phase 1.
name: ivac
services:
  web:
    image: nginx:1.27-alpine
    container_name: ivac-web
    restart: unless-stopped
    volumes:
      - ../../site:/usr/share/nginx/html:ro
    mem_limit: 64m
    networks:
      - proxy

networks:
  proxy:
    external: true
